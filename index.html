<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stepper</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h3 class="logo"> Stepper</h3>
    </header>
    <div class="stepper">
        <div class="steps">
            <div class="step active">
                <span class="circle">1</span>
                <p>Contact Details</p>
            </div>
    
            <div class="step">
                <span class="circle">2</span>
                <p>Shipping Address</p>
            </div>
    
            <div class="step">
                <span class="circle">3</span>
                <p>Payment</p>
            </div>
    
            <div class="step">
                <span class="circle">4</span>
                <p>Delivered</p>
            </div>
        </div>
    
        <p class="description">
            Add contact details for further communications.
        </p>
    
        <div class="prev-next">
            <button class="previous" disabled>Previous</button>
            <button class="next">Next</button>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
